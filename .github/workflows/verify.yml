name: verify

on:
  push:
    branches: [main]
    paths-ignore: ["proof/**", "**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [typescript, python, cpp, go, java, rust, ruby]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: matrix.lang == 'typescript'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - if: matrix.lang == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - if: matrix.lang == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.22" }
      - if: matrix.lang == 'java'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - if: matrix.lang == 'ruby'
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
        with: { ruby-version: "3.3" }
      - run: scripts/verify.sh ${{ matrix.lang }}
        env: { FORCE_COLOR: "1" }

  proof:
    name: record proof (video, screenshots, log)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.22" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
        with: { ruby-version: "3.3" }
      # Also warms the build caches so the recordings show tests, not compile time.
      - name: Full run log
        run: scripts/proof-log.sh
      # The recorder's shell doesn't inherit PATH from the setup-* steps, so export it
      # in a hidden step at the top of each tape.
      - name: Pin toolchain environment for the recordings
        run: |
          {
            echo 'Hide'
            echo "Type \"export PATH='$PATH' JAVA_HOME='$JAVA_HOME' GOTOOLCHAIN=local\""
            echo 'Enter'
            echo 'Type "clear"'
            echo 'Enter'
            echo 'Sleep 500ms'
            echo 'Show'
          } > /tmp/env.tape
          mkdir -p proof/screenshots
          for t in proof/demo.tape proof/screens.tape; do
            sed -i '/^# --- recording starts ---$/r /tmp/env.tape' "$t"
          done
      - name: Record video
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2
        with: { path: proof/demo.tape }
      - name: Record screenshots
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2
        with: { path: proof/screens.tape, install-fonts: false }
      - run: git checkout -- proof/demo.tape proof/screens.tape && rm -f proof/screens.gif
      - name: Build proof index
        run: scripts/proof-index.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: proof, path: proof/, if-no-files-found: ignore }
      - name: Commit proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add proof/
          git diff --cached --quiet && exit 0
          git commit -m "Update proof: video, screenshots, log [skip ci]"
          git push
